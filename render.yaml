# Render Blueprint: https://render.com/docs/blueprint-spec
# Everything here runs on free plans: Render's free web service, plus a
# free Neon Postgres database (Render's free disk is wiped on every
# redeploy/sleep, so saved drawings live in the database instead).
services:
  - type: web
    name: aorvis-radar-viewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker + threads: the free plan has 512 MB of RAM. Tile requests
    # mostly wait on upstream servers, so 8 threads keep one slow source
    # (e.g. Bhuvan) from blocking every other layer's tiles.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 90
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FLASK_DEBUG
        value: "0"
      # Secrets: Render asks for these in the dashboard (never committed).
      - key: SENTINEL_CLIENT_ID
        sync: false
      - key: SENTINEL_CLIENT_SECRET
        sync: false
      - key: SENTINEL_INSTANCE_ID
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
